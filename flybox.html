    function localGet(key) {
      try {
        const raw = localStorage.getItem(key);
        if (raw !== null) return { value: raw };
        return null;
      } catch { return null; }
    }
    function localSet(key, value) {
      try { localStorage.setItem(key, value); } catch {}

  "Nymph": "N",

const HATCH_COLORS = {
  "BWO": { bg: "#2d4a3e", accent: "#7fb069", text: "#c8e6c0" },
  "PMD": { bg: "#4a3d2d", accent: "#d4a44c", text: "#f0ddb8" },
  "Midge": { bg: "#2d3a4a", accent: "#6b8fbd", text: "#b8d0f0" },
  "Stonefly": { bg: "#4a2d2d", accent: "#c47a5a", text: "#f0c8b8" }
};

const STORAGE_KEY = "fly-db-v2";
const BOX_STORAGE_KEY = "fly-box-v1";

function FlyDatabase() {
  const [flies, setFlies] = useState([]);
  const [boxData, setBoxData] = useState({});
  const [loading, setLoading] = useState(true);
  const [filters, setFilters] = useState({ hatch: [], style: [], season: [], condition: [] });
  const [boxFilter, setBoxFilter] = useState("all"); // "all", "inBox", "needToTie"
  const [searchTerm, setSearchTerm] = useState("");
  const [expandedFly, setExpandedFly] = useState(null);
  const [showAddForm, setShowAddForm] = useState(false);
  const [editingFly, setEditingFly] = useState(null);
  const [viewMode, setViewMode] = useState("grid");
  const [sortBy, setSortBy] = useState("hatch");
  const scrollRef = useRef(null);

  // Load data from persistent storage
  useEffect(() => {
    async function loadData() {
      try {
        const result = localGet(STORAGE_KEY);
        if (result && result.value) {
          setFlies(JSON.parse(result.value));
        } else {
          setFlies(INITIAL_FLIES);
          localSet(STORAGE_KEY, JSON.stringify(INITIAL_FLIES));
        }
      } catch (e) {
        setFlies(INITIAL_FLIES);
        try { localSet(STORAGE_KEY, JSON.stringify(INITIAL_FLIES)); } catch {}
      }
      try {
        const boxResult = localGet(BOX_STORAGE_KEY);
        if (boxResult && boxResult.value) {
          setBoxData(JSON.parse(boxResult.value));
        }
      } catch {}
      setLoading(false);
    }
    loadData();
  }, []);

  // Save flies to storage
  const saveFlies = useCallback(async (updated) => {
    setFlies(updated);
    try { localSet(STORAGE_KEY, JSON.stringify(updated)); } catch {}
  }, []);

  // Save box data to storage
  const saveBoxData = useCallback(async (updated) => {
    setBoxData(updated);
    try { localSet(BOX_STORAGE_KEY, JSON.stringify(updated)); } catch {}
  }, []);

  // Toggle fly in/out of box
  const toggleInBox = useCallback(async (flyId) => {
    const current = boxData[flyId];
    let updated;
    if (current?.inBox) {
      updated = { ...boxData };
      delete updated[flyId];
    } else {
      updated = { ...boxData, [flyId]: { inBox: true, qty: 1, sizes: [] } };
    }
    await saveBoxData(updated);
  }, [boxData, saveBoxData]);

  // Update box details for a fly
  const updateBoxDetails = useCallback(async (flyId, details) => {
    const updated = { ...boxData, [flyId]: { ...boxData[flyId], ...details } };
    await saveBoxData(updated);
  }, [boxData, saveBoxData]);

  // Box stats
  const boxStats = useMemo(() => {
    const inBox = Object.values(boxData).filter(b => b.inBox).length;
    const totalQty = Object.values(boxData).reduce((sum, b) => sum + (b.qty || 0), 0);
    return { inBox, totalQty, total: flies.length };
  }, [boxData, flies]);

  // Filtering
  const filteredFlies = useMemo(() => {
    let result = flies;
    if (filters.hatch.length) result = result.filter(f => filters.hatch.includes(f.hatch));
    if (filters.style.length) result = result.filter(f => filters.style.includes(f.style));
    if (filters.season.length) result = result.filter(f => f.seasons?.some(s => filters.season.includes(s)));
    if (filters.condition.length) result = result.filter(f => f.conditions?.some(c => filters.condition.includes(c)));
    if (boxFilter === "inBox") result = result.filter(f => boxData[f.id]?.inBox);
    if (boxFilter === "needToTie") result = result.filter(f => !boxData[f.id]?.inBox);
    if (searchTerm.trim()) {
      const q = searchTerm.toLowerCase();
      result = result.filter(f =>
        f.name.toLowerCase().includes(q) ||
        f.hatch.toLowerCase().includes(q) ||
        f.hook?.toLowerCase().includes(q) ||
        Object.values(f.materials || {}).some(m => m.toLowerCase().includes(q))
      );
    }
    if (sortBy === "hatch") {
      result = [...result].sort((a, b) => a.hatch.localeCompare(b.hatch) || a.name.localeCompare(b.name));
    } else if (sortBy === "style") {
      result = [...result].sort((a, b) => a.style.localeCompare(b.style) || a.name.localeCompare(b.name));
    } else if (sortBy === "name") {
      result = [...result].sort((a, b) => a.name.localeCompare(b.name));
    }
    return result;
  }, [flies, filters, searchTerm, sortBy, boxFilter, boxData]);

  const toggleFilter = (category, value) => {
    setFilters(prev => {
      const arr = prev[category];
      return { ...prev, [category]: arr.includes(value) ? arr.filter(v => v !== value) : [...arr, value] };
    });
  };

  const clearFilters = () => {
    setFilters({ hatch: [], style: [], season: [], condition: [] });
    setBoxFilter("all");
    setSearchTerm("");
  };

  const activeFilterCount = Object.values(filters).flat().length + (searchTerm ? 1 : 0) + (boxFilter !== "all" ? 1 : 0);

  const deleteFly = async (id) => {
    const updated = flies.filter(f => f.id !== id);
    await saveFlies(updated);
    setExpandedFly(null);
  };

  const resetToDefaults = async () => {
    if (confirm("This will reset all flies back to the original patterns and clear your box inventory. Continue?")) {
      await saveFlies(INITIAL_FLIES);
      await saveBoxData({});
    }
  };

  if (loading) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: "#1a1f16", color: "#a8b89a", fontFamily: "'EB Garamond', Georgia, serif" }}>
        <p style={{ fontSize: 18, letterSpacing: 1 }}>Loading your fly box...</p>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh",
      background: "#1a1f16",
      color: "#d4dcc8",
      fontFamily: "'EB Garamond', Georgia, serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a4230; border-radius: 3px; }
        .filter-btn {
          padding: 6px 14px; border-radius: 20px; border: 1px solid #3a4230;
          background: transparent; color: #8a9a7c; cursor: pointer; font-size: 13px;
          font-family: 'DM Sans', sans-serif; transition: all 0.2s; white-space: nowrap;
        }
        .filter-btn:hover { border-color: #7fb069; color: #7fb069; }
        .filter-btn.active { background: #2d4a3e; border-color: #7fb069; color: #c8e6c0; }
        .fly-card {
          background: #222a1e; border: 1px solid #2e3628; border-radius: 12px;
          cursor: pointer; transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .fly-card:hover { border-color: #4a5a3e; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .material-row { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #2e362833; }
        .material-row:last-child { border-bottom: none; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-family: 'DM Sans', sans-serif; }
        input, select, textarea {
          background: #2a3224; border: 1px solid #3a4230; color: #d4dcc8; border-radius: 8px;
          padding: 8px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; width: 100%;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #7fb069; }
        .action-btn {
          padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
          font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .ref-link {
          color: #7fb069; text-decoration: none; font-family: 'DM Sans', sans-serif;
          font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
        }
        .ref-link:hover { color: #a8e090; text-decoration: underline; }
        .stat-number { font-size: 28px; font-weight: 700; color: #7fb069; line-height: 1; }
        .stat-label { font-size: 11px; color: #6a7a5c; font-family: 'DM Sans', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
      `}</style>

      {/* Header */}
      <header style={{
        padding: "32px 24px 20px",
        borderBottom: "1px solid #2e3628",
        background: "linear-gradient(180deg, #222a1e 0%, #1a1f16 100%)"
      }}>
        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h1 style={{ fontSize: 32, fontWeight: 600, color: "#e8f0dc", letterSpacing: -0.5, lineHeight: 1.1 }}>
                Fly Box
              </h1>
              <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#6a7a5c", marginTop: 4 }}>
                {flies.length} patterns loaded
              </p>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setEditingFly(null); setShowAddForm(true); }}
                className="action-btn" style={{ background: "#7fb069", color: "#1a1f16" }}>
                + Add Fly
              </button>
              <button onClick={resetToDefaults}
                className="action-btn" style={{ background: "#2a3224", color: "#8a9a7c" }}>
                Reset
              </button>
            </div>
          </div>

          {/* Quick Stats */}
          <div style={{ display: "flex", gap: 20, marginTop: 20, flexWrap: "wrap", alignItems: "center" }}>
            {ALL_HATCHES.map(h => (
              <div key={h} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span className="stat-number" style={{ color: HATCH_COLORS[h].accent }}>
                  {flies.filter(f => f.hatch === h).length}
                </span>
                <span className="stat-label">{h}</span>
              </div>
            ))}
            <div style={{ width: 1, height: 32, background: "#3a4230", margin: "0 4px" }} />
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span className="stat-number" style={{ color: "#d4a44c" }}>
                {boxStats.inBox}
              </span>
              <span className="stat-label">In Box</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span className="stat-number" style={{ color: "#6b8fbd" }}>
                {boxStats.totalQty}
              </span>
              <span className="stat-label">Total Flies</span>
            </div>
          </div>
        </div>
      </header>

      {/* Filters */}
      <div style={{ padding: "16px 24px", borderBottom: "1px solid #2e3628", background: "#1e241a" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          {/* Search */}
          <div style={{ position: "relative", marginBottom: 14 }}>
            <input
              type="text"
              placeholder="Search flies, materials, hooks..."
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{ paddingLeft: 36 }}
            />
            <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#6a7a5c", fontSize: 14 }}>
              {"🔍"}
            </span>
          </div>

          {/* Filter Groups */}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <FilterRow label="Hatch" options={ALL_HATCHES} active={filters.hatch} onToggle={v => toggleFilter("hatch", v)} />
            <FilterRow label="Style" options={ALL_STYLES} active={filters.style} onToggle={v => toggleFilter("style", v)} />
            <FilterRow label="Season" options={ALL_SEASONS} active={filters.season} onToggle={v => toggleFilter("season", v)} />
            <FilterRow label="Water" options={ALL_CONDITIONS} active={filters.condition} onToggle={v => toggleFilter("condition", v)} />
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{
                fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c",
                width: 50, flexShrink: 0, textTransform: "uppercase", letterSpacing: 1
              }}>Box</span>
              {[
                { key: "all", label: "All Patterns" },
                { key: "inBox", label: "In My Box" },
                { key: "needToTie", label: "Need to Tie" }
              ].map(opt => (
                <button key={opt.key}
                  className={`filter-btn ${boxFilter === opt.key ? "active" : ""}`}
                  onClick={() => setBoxFilter(opt.key)}
                  style={boxFilter === opt.key && opt.key === "inBox" ? { background: "#3d3a1e", borderColor: "#d4a44c", color: "#f0ddb8" } :
                         boxFilter === opt.key && opt.key === "needToTie" ? { background: "#3a1e2d", borderColor: "#bd6b8f", color: "#f0b8d0" } : {}}>
                  {opt.label}
                  {opt.key === "inBox" && ` (${boxStats.inBox})`}
                  {opt.key === "needToTie" && ` (${boxStats.total - boxStats.inBox})`}
                </button>
              ))}
            </div>
          </div>

          {activeFilterCount > 0 && (
            <div style={{ marginTop: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#6a7a5c" }}>
                Showing {filteredFlies.length} of {flies.length} patterns
              </span>
              <button onClick={clearFilters} style={{
                background: "none", border: "none", color: "#7fb069", cursor: "pointer",
                fontFamily: "'DM Sans', sans-serif", fontSize: 13
              }}>
                Clear all filters
              </button>
            </div>
          )}

          {/* Sort & View */}
          <div style={{ display: "flex", gap: 12, marginTop: 12, alignItems: "center" }}>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c" }}>Sort:</span>
            {["hatch", "style", "name"].map(s => (
              <button key={s} onClick={() => setSortBy(s)}
                className={`filter-btn ${sortBy === s ? "active" : ""}`}
                style={{ padding: "4px 12px", fontSize: 12 }}>
                {s.charAt(0).toUpperCase() + s.slice(1)}
              </button>
            ))}
            <div style={{ flex: 1 }} />
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c" }}>View:</span>
            <button onClick={() => setViewMode("grid")}
              className={`filter-btn ${viewMode === "grid" ? "active" : ""}`}
              style={{ padding: "4px 10px", fontSize: 12 }}>Grid</button>
            <button onClick={() => setViewMode("list")}
              className={`filter-btn ${viewMode === "list" ? "active" : ""}`}
              style={{ padding: "4px 10px", fontSize: 12 }}>List</button>
          </div>
        </div>
      </div>

      {/* Fly Cards */}
      <main style={{ padding: "20px 24px 60px", maxWidth: 1200, margin: "0 auto" }} ref={scrollRef}>
        {viewMode === "grid" ? (
          <div style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
            gap: 16
          }}>
            {filteredFlies.map(fly => (
              <FlyCard key={fly.id} fly={fly} expanded={expandedFly === fly.id}
                onToggle={() => setExpandedFly(expandedFly === fly.id ? null : fly.id)}
                onEdit={() => { setEditingFly(fly); setShowAddForm(true); }}
                onDelete={() => deleteFly(fly.id)}
                boxEntry={boxData[fly.id]}
                onToggleBox={() => toggleInBox(fly.id)}
                onUpdateBox={(details) => updateBoxDetails(fly.id, details)}
              />
            ))}
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {filteredFlies.map(fly => (
              <FlyListRow key={fly.id} fly={fly} expanded={expandedFly === fly.id}
                onToggle={() => setExpandedFly(expandedFly === fly.id ? null : fly.id)}
                onEdit={() => { setEditingFly(fly); setShowAddForm(true); }}
                onDelete={() => deleteFly(fly.id)}
                boxEntry={boxData[fly.id]}
                onToggleBox={() => toggleInBox(fly.id)}
                onUpdateBox={(details) => updateBoxDetails(fly.id, details)}
              />
            ))}
          </div>
        )}
        {filteredFlies.length === 0 && (
          <div style={{ textAlign: "center", padding: 60, color: "#6a7a5c" }}>
            <p style={{ fontSize: 18 }}>No flies match your filters</p>
            <button onClick={clearFilters} style={{
              marginTop: 12, background: "none", border: "1px solid #3a4230", color: "#7fb069",
              padding: "8px 20px", borderRadius: 8, cursor: "pointer", fontFamily: "'DM Sans', sans-serif"
            }}>Clear filters</button>
          </div>
        )}
      </main>

      {/* Add/Edit Modal */}
      {showAddForm && (
        <AddEditModal
          fly={editingFly}
          onSave={async (flyData) => {
            let updated;
            if (editingFly) {
              updated = flies.map(f => f.id === editingFly.id ? { ...f, ...flyData } : f);
            } else {
              updated = [...flies, { ...flyData, id: `custom-${Date.now()}` }];
            }
            await saveFlies(updated);
            setShowAddForm(false);
            setEditingFly(null);
          }}
          onClose={() => { setShowAddForm(false); setEditingFly(null); }}
        />
      )}
    </div>
  );
}

function FilterRow({ label, options, active, onToggle }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      <span style={{
        fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c",
        width: 50, flexShrink: 0, textTransform: "uppercase", letterSpacing: 1
      }}>{label}</span>
      {options.map(o => (
        <button key={o} className={`filter-btn ${active.includes(o) ? "active" : ""}`}
          onClick={() => onToggle(o)}>{o}</button>
      ))}
    </div>
  );
}

function FlyCard({ fly, expanded, onToggle, onEdit, onDelete, boxEntry, onToggleBox, onUpdateBox }) {
  const hc = HATCH_COLORS[fly.hatch] || HATCH_COLORS.BWO;
  const inBox = boxEntry?.inBox;
  return (
    <div className="fly-card" onClick={onToggle}
      style={inBox ? { borderColor: "#4a5a2e", boxShadow: "inset 0 0 0 1px #4a5a2e33" } : {}}>
      <div style={{ padding: "16px 18px" }}>
        {/* Top line */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <span className="tag" style={{ background: hc.bg, color: hc.text, border: `1px solid ${hc.accent}44` }}>
              {fly.hatch}
            </span>
            <span className="tag" style={{ background: "#2a3224", color: "#8a9a7c" }}>
              {STYLE_ICONS[fly.style] || ""} {fly.style}
            </span>
          </div>
          {/* Box toggle */}
          <button
            onClick={e => { e.stopPropagation(); onToggleBox(); }}
            style={{
              background: inBox ? "#3d4a1e" : "transparent",
              border: inBox ? "1px solid #7fb069" : "1px solid #3a4230",
              borderRadius: 6, padding: "3px 10px", cursor: "pointer",
              fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 500,
              color: inBox ? "#c8e6c0" : "#6a7a5c", transition: "all 0.2s",
              display: "flex", alignItems: "center", gap: 4, flexShrink: 0
            }}
            title={inBox ? "Remove from box" : "Add to box"}
          >
            {inBox ? "In Box" : "+ Box"}
            {inBox && boxEntry.qty > 0 && (
              <span style={{
                background: "#7fb069", color: "#1a1f16", borderRadius: 10,
                padding: "0 6px", fontSize: 10, fontWeight: 700, marginLeft: 2
              }}>{boxEntry.qty}</span>
            )}
          </button>
        </div>
        {/* Name */}
        <h3 style={{ fontSize: 19, fontWeight: 600, color: "#e8f0dc", marginBottom: 6, lineHeight: 1.2 }}>
          {fly.name}
        </h3>
        {/* Quick info */}
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "flex", gap: 12, flexWrap: "wrap" }}>
          <span>Hook: {fly.hook}</span>
          <span>Sizes: {fly.sizes}</span>
          {fly.coreSizes && <span>Core: {fly.coreSizes}</span>}
        </div>
        {/* Box sizes if present */}
        {inBox && boxEntry.sizes?.length > 0 && (
          <div style={{ marginTop: 6, fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#7fb069" }}>
            Tied in: {boxEntry.sizes.join(", ")}
          </div>
        )}
        {/* Tags */}
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginTop: 10 }}>
          {fly.seasons?.map(s => (
            <span key={s} className="tag" style={{ background: "#1a2818", color: "#7a9a6a", fontSize: 10 }}>{s}</span>
          ))}
          {fly.conditions?.map(c => (
            <span key={c} className="tag" style={{ background: "#1a2028", color: "#6a8a9a", fontSize: 10 }}>{c}</span>
          ))}
        </div>
      </div>

      {/* Expanded details */}
      {expanded && (
        <div style={{ padding: "0 18px 16px", borderTop: "1px solid #2e3628" }} onClick={e => e.stopPropagation()}>
          {/* Box management section */}
          {inBox && (
            <BoxDetails boxEntry={boxEntry} fly={fly} onUpdateBox={onUpdateBox} />
          )}
          {fly.notes && (
            <p style={{ fontSize: 14, color: "#a8b89a", fontStyle: "italic", margin: "12px 0", lineHeight: 1.5 }}>
              {fly.notes}
            </p>
          )}
          {/* Colors */}
          {fly.colors?.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Colors</h4>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {fly.colors.map(c => (
                  <span key={c} className="tag" style={{ background: "#2a3224", color: "#a8b89a" }}>{c}</span>
                ))}
              </div>
            </div>
          )}
          {/* Materials */}
          <div style={{ marginBottom: 12 }}>
            <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Materials</h4>
            {Object.entries(fly.materials || {}).map(([k, v]) => (
              <div key={k} className="material-row">
                <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", minWidth: 90, flexShrink: 0 }}>{k}</span>
                <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#c8d8b8" }}>{v}</span>
              </div>
            ))}
          </div>
          {/* Tying References */}
          {fly.tyingRefs?.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Tying References</h4>
              {fly.tyingRefs.map((ref, i) => (
                <a key={i} href={ref.url} target="_blank" rel="noopener noreferrer" className="ref-link" style={{ display: "block", marginBottom: 4 }}>
                  ▶ {ref.label}
                </a>
              ))}
            </div>
          )}
          {/* Actions */}
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button onClick={onEdit} className="action-btn" style={{ background: "#2d4a3e", color: "#7fb069" }}>Edit</button>
            <button onClick={() => { if (confirm(`Delete "${fly.name}"?`)) onDelete(); }}
              className="action-btn" style={{ background: "#4a2d2d", color: "#c47a5a" }}>Delete</button>
          </div>
        </div>
      )}
    </div>
  );
}

function FlyListRow({ fly, expanded, onToggle, onEdit, onDelete, boxEntry, onToggleBox, onUpdateBox }) {
  const hc = HATCH_COLORS[fly.hatch] || HATCH_COLORS.BWO;
  const inBox = boxEntry?.inBox;
  return (
    <div className="fly-card" onClick={onToggle}
      style={{ borderRadius: 8, ...(inBox ? { borderColor: "#4a5a2e" } : {}) }}>
      <div style={{ padding: "12px 18px", display: "flex", alignItems: "center", gap: 14 }}>
        <button
          onClick={e => { e.stopPropagation(); onToggleBox(); }}
          style={{
            width: 22, height: 22, borderRadius: 4, flexShrink: 0, cursor: "pointer",
            background: inBox ? "#3d4a1e" : "transparent",
            border: inBox ? "2px solid #7fb069" : "2px solid #3a4230",
            display: "flex", alignItems: "center", justifyContent: "center",
            color: "#7fb069", fontSize: 14, fontWeight: 700, transition: "all 0.2s"
          }}
          title={inBox ? "Remove from box" : "Add to box"}
        >{inBox ? "+" : ""}</button>
        <span className="tag" style={{ background: hc.bg, color: hc.text, border: `1px solid ${hc.accent}44`, flexShrink: 0 }}>
          {fly.hatch}
        </span>
        <span style={{ flex: 1, fontSize: 16, fontWeight: 500, color: "#e8f0dc" }}>{fly.name}</span>
        {inBox && boxEntry.qty > 0 && (
          <span style={{
            fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#7fb069",
            background: "#2d3a1e", padding: "2px 8px", borderRadius: 10, flexShrink: 0
          }}>qty: {boxEntry.qty}</span>
        )}
        <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", flexShrink: 0 }}>
          {STYLE_ICONS[fly.style]} {fly.style}
        </span>
        <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", flexShrink: 0, minWidth: 80 }}>
          {fly.hook}
        </span>
        <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", flexShrink: 0 }}>
          {fly.sizes}
        </span>
      </div>
      {expanded && (
        <div style={{ padding: "0 18px 14px", borderTop: "1px solid #2e3628" }} onClick={e => e.stopPropagation()}>
          {inBox && <BoxDetails boxEntry={boxEntry} fly={fly} onUpdateBox={onUpdateBox} />}
          {fly.notes && <p style={{ fontSize: 14, color: "#a8b89a", fontStyle: "italic", margin: "10px 0" }}>{fly.notes}</p>}
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", marginTop: 8 }}>
            <div style={{ flex: 1, minWidth: 200 }}>
              <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Materials</h4>
              {Object.entries(fly.materials || {}).map(([k, v]) => (
                <div key={k} className="material-row">
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", minWidth: 90 }}>{k}</span>
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#c8d8b8" }}>{v}</span>
                </div>
              ))}
            </div>
            <div style={{ minWidth: 180 }}>
              <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>When to Fish</h4>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>
                {fly.seasons?.map(s => <span key={s} className="tag" style={{ background: "#1a2818", color: "#7a9a6a", fontSize: 10 }}>{s}</span>)}
              </div>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 12 }}>
                {fly.conditions?.map(c => <span key={c} className="tag" style={{ background: "#1a2028", color: "#6a8a9a", fontSize: 10 }}>{c}</span>)}
              </div>
              {fly.tyingRefs?.map((ref, i) => (
                <a key={i} href={ref.url} target="_blank" rel="noopener noreferrer" className="ref-link" style={{ display: "block", marginBottom: 4 }}>
                  ▶ {ref.label}
                </a>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={onEdit} className="action-btn" style={{ background: "#2d4a3e", color: "#7fb069" }}>Edit</button>
            <button onClick={() => { if (confirm(`Delete "${fly.name}"?`)) onDelete(); }}
              className="action-btn" style={{ background: "#4a2d2d", color: "#c47a5a" }}>Delete</button>
          </div>
        </div>
      )}
    </div>
  );
}

function BoxDetails({ boxEntry, fly, onUpdateBox }) {
  // Parse the size range from the fly to offer toggleable sizes
  const availableSizes = useMemo(() => {
    const range = fly.sizes?.match(/(\d+)/g);
    if (!range || range.length < 2) return [];
    const start = parseInt(range[0]);
    const end = parseInt(range[range.length - 1]);
    const sizes = [];
    // Hook sizes go up by 2s typically
    for (let s = start; s <= end; s += 2) {
      sizes.push(String(s));
    }
    // Also add odd sizes if the range includes them (some go 14-20 meaning 14,16,18,20)
    return sizes;
  }, [fly.sizes]);

  const toggleSize = (size) => {
    const current = boxEntry.sizes || [];
    const updated = current.includes(size) ? current.filter(s => s !== size) : [...current, size].sort((a, b) => parseInt(a) - parseInt(b));
    onUpdateBox({ sizes: updated });
  };

  return (
    <div style={{
      margin: "12px 0", padding: 12, borderRadius: 8,
      background: "#1e2a16", border: "1px solid #3a4a2e"
    }}>
      <h4 style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#7fb069", textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>
        My Box Inventory
      </h4>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>
        {/* Quantity */}
        <div>
          <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Quantity</label>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button
              onClick={() => onUpdateBox({ qty: Math.max(0, (boxEntry.qty || 1) - 1) })}
              style={{
                width: 28, height: 28, borderRadius: 6, border: "1px solid #3a4230",
                background: "#2a3224", color: "#8a9a7c", cursor: "pointer", fontSize: 16,
                display: "flex", alignItems: "center", justifyContent: "center"
              }}>-</button>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 18, fontWeight: 600, color: "#e8f0dc", minWidth: 28, textAlign: "center" }}>
              {boxEntry.qty || 0}
            </span>
            <button
              onClick={() => onUpdateBox({ qty: (boxEntry.qty || 0) + 1 })}
              style={{
                width: 28, height: 28, borderRadius: 6, border: "1px solid #3a4230",
                background: "#2a3224", color: "#8a9a7c", cursor: "pointer", fontSize: 16,
                display: "flex", alignItems: "center", justifyContent: "center"
              }}>+</button>
          </div>
        </div>
        {/* Sizes I have tied */}
        {availableSizes.length > 0 && (
          <div style={{ flex: 1 }}>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Sizes tied</label>
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
              {availableSizes.map(size => {
                const active = (boxEntry.sizes || []).includes(size);
                return (
                  <button key={size} onClick={() => toggleSize(size)} style={{
                    padding: "3px 10px", borderRadius: 14, fontSize: 12,
                    fontFamily: "'DM Sans', sans-serif", cursor: "pointer", transition: "all 0.15s",
                    background: active ? "#3d4a1e" : "transparent",
                    border: active ? "1px solid #7fb069" : "1px solid #3a4230",
                    color: active ? "#c8e6c0" : "#6a7a5c"
                  }}>{size}</button>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AddEditModal({ fly, onSave, onClose }) {
  const [form, setForm] = useState({
    name: fly?.name || "",
    hatch: fly?.hatch || "BWO",
    style: fly?.style || "Dry Fly",
    hook: fly?.hook || "",
    sizes: fly?.sizes || "",
    coreSizes: fly?.coreSizes || "",
    colors: fly?.colors?.join(", ") || "",
    materialsText: fly?.materials ? Object.entries(fly.materials).map(([k, v]) => `${k}: ${v}`).join("\n") : "",
    refsText: fly?.tyingRefs ? fly.tyingRefs.map(r => `${r.label} | ${r.url}`).join("\n") : "",
    seasons: fly?.seasons || [],
    conditions: fly?.conditions || [],
    notes: fly?.notes || ""
  });

  const update = (field, value) => setForm(prev => ({ ...prev, [field]: value }));
  const toggleArr = (field, value) => {
    setForm(prev => ({
      ...prev,
      [field]: prev[field].includes(value) ? prev[field].filter(v => v !== value) : [...prev[field], value]
    }));
  };

  const handleSave = () => {
    if (!form.name.trim()) { alert("Please enter a fly name"); return; }
    const materials = {};
    form.materialsText.split("\n").filter(Boolean).forEach(line => {
      const idx = line.indexOf(":");
      if (idx > 0) materials[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
    });
    const tyingRefs = form.refsText.split("\n").filter(Boolean).map(line => {
      const parts = line.split("|");
      return { label: parts[0]?.trim() || "Reference", url: parts[1]?.trim() || "" };
    }).filter(r => r.url);

    onSave({
      name: form.name.trim(),
      hatch: form.hatch,
      style: form.style,
      hook: form.hook.trim(),
      sizes: form.sizes.trim(),
      coreSizes: form.coreSizes.trim(),
      colors: form.colors.split(",").map(c => c.trim()).filter(Boolean),
      materials,
      tyingRefs,
      seasons: form.seasons,
      conditions: form.conditions,
      notes: form.notes.trim()
    });
  };

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20
    }} onClick={onClose}>
      <div style={{
        background: "#222a1e", borderRadius: 16, border: "1px solid #3a4230",
        maxWidth: 560, width: "100%", maxHeight: "90vh", overflowY: "auto", padding: 28
      }} onClick={e => e.stopPropagation()}>
        <h2 style={{ fontSize: 22, color: "#e8f0dc", marginBottom: 20 }}>
          {fly ? "Edit Pattern" : "Add New Pattern"}
        </h2>

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Fly Name *</label>
            <input value={form.name} onChange={e => update("name", e.target.value)} placeholder="e.g. Parachute Adams" />
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Hatch</label>
              <select value={form.hatch} onChange={e => update("hatch", e.target.value)}>
                {ALL_HATCHES.map(h => <option key={h} value={h}>{h}</option>)}
              </select>
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Style</label>
              <select value={form.style} onChange={e => update("style", e.target.value)}>
                {ALL_STYLES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Hook</label>
              <input value={form.hook} onChange={e => update("hook", e.target.value)} placeholder="e.g. TMC 100" />
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Size Range</label>
              <input value={form.sizes} onChange={e => update("sizes", e.target.value)} placeholder="e.g. 14-20" />
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Core Sizes</label>
              <input value={form.coreSizes} onChange={e => update("coreSizes", e.target.value)} placeholder="e.g. 16-18" />
            </div>
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Colors (comma separated)</label>
            <input value={form.colors} onChange={e => update("colors", e.target.value)} placeholder="Olive, Dark olive, Gray" />
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Materials (one per line: Label: Material)</label>
            <textarea rows={5} value={form.materialsText} onChange={e => update("materialsText", e.target.value)}
              placeholder={"Tail: Microfibbets\nBody: Olive dubbing\nWing: CDC"} />
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Tying References (one per line: Label | URL)</label>
            <textarea rows={3} value={form.refsText} onChange={e => update("refsText", e.target.value)}
              placeholder={"Charlie Craven | https://youtube.com/..."} />
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 6 }}>Seasons</label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ALL_SEASONS.map(s => (
                <button key={s} className={`filter-btn ${form.seasons.includes(s) ? "active" : ""}`}
                  onClick={() => toggleArr("seasons", s)}>{s}</button>
              ))}
            </div>
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 6 }}>Water Conditions</label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ALL_CONDITIONS.map(c => (
                <button key={c} className={`filter-btn ${form.conditions.includes(c) ? "active" : ""}`}
                  onClick={() => toggleArr("conditions", c)}>{c}</button>
              ))}
            </div>
          </div>
          <div>
            <label style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#6a7a5c", display: "block", marginBottom: 4 }}>Notes</label>
            <textarea rows={2} value={form.notes} onChange={e => update("notes", e.target.value)}
              placeholder="When/how to fish this pattern..." />
          </div>
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 22, justifyContent: "flex-end" }}>
          <button onClick={onClose} className="action-btn" style={{ background: "#2a3224", color: "#8a9a7c" }}>Cancel</button>
          <button onClick={handleSave} className="action-btn" style={{ background: "#7fb069", color: "#1a1f16" }}>
            {fly ? "Save Changes" : "Add Pattern"}
          </button>
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(FlyDatabase));
  </script>
</body>
</html>
